name: Build and Push Docker

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型 (cpu 或 gpu)'
        required: true
        default: 'cpu'
        type: choice
        options:
          - cpu
          - gpu

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 深度清理磁盘空间
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # 3. 登录阿里云 Docker Registry
      - name: Login to Repo
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 4. Build and Push Images
      - name: Build and Push Images
        run: |
          chmod +x docker/build.sh
          TYPE="${{ inputs.build_type }}"
          echo "Selected build type: $TYPE"
          
          # Define Tags
          CI_IMAGE_NAME="ci_${TYPE}"
          DEMO_IMAGE_NAME="demo_${TYPE}"
          
          FULL_TAG_CI="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/tvm-${CI_IMAGE_NAME}:latest"
          FULL_TAG_DEMO="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/tvm-${DEMO_IMAGE_NAME}:latest"
          
          echo "CI Image Target: $FULL_TAG_CI"
          echo "Demo Image Target: $FULL_TAG_DEMO"
          
          # --- Step A: CI Image ---
          
          # 1. Try to pull existing CI image for cache
          echo ">>> Pulling existing CI image for cache (if available)..."
          docker pull $FULL_TAG_CI || true
          
          # 2. Build Base CI Image
          echo ">>> Building Base Image: $CI_IMAGE_NAME"
          # Pass the registry image as cache source
          ./docker/build.sh $CI_IMAGE_NAME --cache-from $FULL_TAG_CI
          
          # 3. Retag and Push CI Image IMMEDIATELY
          # This ensures the expensive build is saved even if the Demo build fails later.
          SOURCE_TAG_CI="tvm.${CI_IMAGE_NAME}"
          echo "Retagging $SOURCE_TAG_CI to $FULL_TAG_CI"
          docker tag $SOURCE_TAG_CI $FULL_TAG_CI
          echo "Pushing $FULL_TAG_CI ..."
          docker push $FULL_TAG_CI
          
          # --- Step B: Demo Image ---
          
          # 4. Try to pull existing Demo image for cache
          echo ">>> Pulling existing Demo image for cache (if available)..."
          docker pull $FULL_TAG_DEMO || true
          
          # 5. Build Demo Image
          echo ">>> Building Demo Image: $DEMO_IMAGE_NAME (based on $CI_IMAGE_NAME)"
          # Pass both CI and Demo registry images as cache sources
          ./docker/build.sh $DEMO_IMAGE_NAME --context-path . --cache-from $FULL_TAG_CI --cache-from $FULL_TAG_DEMO
          
          # 6. Retag and Push Demo Image
          SOURCE_TAG_DEMO="tvm.${DEMO_IMAGE_NAME}"
          echo "Retagging $SOURCE_TAG_DEMO to $FULL_TAG_DEMO"
          docker tag $SOURCE_TAG_DEMO $FULL_TAG_DEMO
          echo "Pushing $FULL_TAG_DEMO ..."
          docker push $FULL_TAG_DEMO