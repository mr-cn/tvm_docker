name: Build and Push Docker

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型 (cpu 或 gpu)'
        required: true
        default: 'cpu'
        type: choice
        options:
          - cpu
          - gpu

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 深度清理磁盘空间
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # 3. 登录阿里云 Docker Registry
      - name: Login to Repo
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 4. 执行构建脚本
      - name: Build Images
        run: |
          chmod +x docker/build.sh
          TYPE="${{ inputs.build_type }}"
          
          echo "Selected build type: $TYPE"
          
          # Step A: Build Base CI Image (ci_cpu or ci_gpu)
          CI_IMAGE="ci_${TYPE}"
          echo ">>> Building Base Image: $CI_IMAGE"
          ./docker/build.sh $CI_IMAGE
          
          # Step B: Build Demo Image (demo_cpu or demo_gpu)
          DEMO_IMAGE="demo_${TYPE}"
          echo ">>> Building Demo Image: $DEMO_IMAGE (based on $CI_IMAGE)"
          # using --context-path . to include project root in context
          ./docker/build.sh $DEMO_IMAGE --context-path .

      # 5. 重新打标签并推送
      - name: Tag and Push Images
        run: |
          TYPE="${{ inputs.build_type }}"
          CI_IMAGE="ci_${TYPE}"
          DEMO_IMAGE="demo_${TYPE}"
          
          # Push CI Image
          SOURCE_TAG_CI="tvm.${CI_IMAGE}"
          TARGET_TAG_CI="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/tvm-${CI_IMAGE}:latest"
          echo "Retagging $SOURCE_TAG_CI to $TARGET_TAG_CI"
          docker tag $SOURCE_TAG_CI $TARGET_TAG_CI
          echo "Pushing $TARGET_TAG_CI ..."
          docker push $TARGET_TAG_CI
          
          # Push Demo Image
          SOURCE_TAG_DEMO="tvm.${DEMO_IMAGE}"
          TARGET_TAG_DEMO="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/tvm-${DEMO_IMAGE}:latest"
          echo "Retagging $SOURCE_TAG_DEMO to $TARGET_TAG_DEMO"
          docker tag $SOURCE_TAG_DEMO $TARGET_TAG_DEMO
          echo "Pushing $TARGET_TAG_DEMO ..."
          docker push $TARGET_TAG_DEMO